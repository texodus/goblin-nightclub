[package]
name = "goblin_nightclub"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A 2D WebAssembly + WebGPU game"
authors = ["Andrew Stein <steinlink@gmail.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "console"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }

[build-dependencies]
png = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
