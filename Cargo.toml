[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["Andrew Stein <steinlink@gmail.com>"]
license = "MIT"
publish = false

[workspace.dependencies]
goblin-nightclub-core = { path = "crates/core" }
goblin-nightclub-generate = { path = "crates/generate" }
goblin-nightclub-game = { path = "crates/game" }
goblin-nightclub-editor = { path = "crates/editor" }
bytemuck = { version = "1.25", features = ["derive"] }
console_error_panic_hook = "0.1.7"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "console"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }

# Profiles are only honored here, at the workspace root.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
